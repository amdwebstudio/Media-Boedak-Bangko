BODY: Kejadian bermula pukul 05.30 WIB saat debit sungai Batang Merangin naik drastis. Jembatan kayu yang sudah berusia 15 tahun tak mampu menahan arus. Warga Dusun 1-4 kini terisolir. Kepala Desa Bangko, Bapak Junaidi, langsung koordinasi dengan Dinas PUPR Kabupaten Merangin. Tim BPBD sudah di lokasi.

Menurut warga, jembatan ini satu-satunya akses utama untuk distribusi hasil pertanian dan akses pendidikan. "Anak saya harus memutar 5 km lewat hutan," ujar Ibu Siti, warga Dusun 3.
